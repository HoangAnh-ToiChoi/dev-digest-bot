name: Dev Digest to Telegram

on:
  schedule:
    # Giờ UTC = giờ Việt Nam - 7. GitHub hay bỏ lỡ lịch đặt đúng giờ chẵn (:00) và có thể chạy trễ,
    # nên đặt lệch phút và thêm 2 mốc dự phòng; mốc nào chạy trước thì gửi, các mốc sau tự bỏ qua.
    - cron: "43 0 * * *"  # 7:43 sáng VN → thường tới khoảng 8h
    - cron: "23 1 * * *"  # 8:23 dự phòng
    - cron: "7 2 * * *"   # 9:07 dự phòng
  workflow_dispatch:       # bấm chạy tay trong tab Actions để test

permissions:
  contents: write          # để lưu lại state/sent.json (chống gửi trùng tin)

concurrency:
  group: dev-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python dev_digest.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      - name: Lưu danh sách tin đã gửi
        run: |
          git config user.name "dev-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json
          git diff --cached --quiet || (git commit -m "chore: update sent digest state" && git push)
