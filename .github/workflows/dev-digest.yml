name: Dev Digest to Telegram

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 8:00 sáng giờ Việt Nam (GitHub có thể chạy trễ 5–30 phút)
  workflow_dispatch:       # bấm chạy tay trong tab Actions để test

permissions:
  contents: write          # để lưu lại state/sent.json (chống gửi trùng tin)

concurrency:
  group: dev-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python dev_digest.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      - name: Lưu danh sách tin đã gửi
        run: |
          git config user.name "dev-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json
          git diff --cached --quiet || (git commit -m "chore: update sent digest state" && git push)
